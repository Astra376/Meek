name: Chat checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      # The checked-in wrapper JAR is from Gradle 4.4.1 and fails validation.
      # Install 8.7 directly so CI never executes that stale JAR.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false
      - name: Test chat recovery
        run: gradle :app:testDebugUnitTest --tests com.example.aichat.feature.chat.ChatRepositoryTest --tests com.example.aichat.core.network.WorkerStreamingClientTest --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meek-chat-fix-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
