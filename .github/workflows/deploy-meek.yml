name: Deploy Meek and build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'android-app/**'
      - '.github/workflows/deploy-meek.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # Production still exports ImageGenerationJob Durable Objects from a newer
      # Worker version than this repository. Only update the model binding;
      # uploading this older source would remove the production class.
      - name: Update production model without replacing Worker code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint = 'https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker/secrets-bulk'
          body = json.dumps({'secrets': {'OPENROUTER_MODEL': {
              'type': 'secret_text', 'name': 'OPENROUTER_MODEL',
              'text': 'xiaomi/mimo-v2.6-pro'
          }}}).encode()
          req = urllib.request.Request(endpoint, data=body, method='PATCH', headers={
              'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'],
              'Content-Type': 'application/merge-patch+json'
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          if not result.get('success'):
              raise RuntimeError('Cloudflare rejected the model binding update: '+str(result.get('errors')))
          assert 'OPENROUTER_MODEL' in result.get('result', {}), 'No model secret acknowledged'
          print('Updated live OpenRouter model binding while preserving Worker code and Durable Objects')
          PY

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false
      - name: Build Meek debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: meek-mimo-v2-6-pro-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
