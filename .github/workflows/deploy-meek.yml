name: Remove Meek legacy DeepSeek fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-meek.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-fallback:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Delete production DeepSeek fallback and deploy preserved code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '6418d8b7a0996630c6eb574d93c85b54'
        run: |
          set -euo pipefail
          printf 'y\n' | npx wrangler versions secret delete OPENROUTER_FALLBACK_MODELS --name character-chat-worker 2>&1 | tee /tmp/delete-fallback.log
          VERSION=$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/delete-fallback.log | tail -n1)
          test -n "$VERSION"
          npx wrangler versions deploy "$VERSION@100%" --name character-chat-worker --yes
