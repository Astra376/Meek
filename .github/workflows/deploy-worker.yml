name: Deploy Meek Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Identify the existing Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler whoami --json > "$RUNNER_TEMP/cloudflare-whoami.json"
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open(os.path.join(os.environ["RUNNER_TEMP"], "cloudflare-whoami.json")) as source:
              accounts = json.load(source)["accounts"]
          matches = []
          for account in accounts:
              request = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4/accounts/{account["id"]}/workers/subdomain',
                  headers={"Authorization": f'Bearer {os.environ["CLOUDFLARE_API_TOKEN"]}'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      subdomain = json.load(response)["result"]["subdomain"]
              except (urllib.error.HTTPError, urllib.error.URLError, KeyError) as error:
                  print(f'Could not check Workers subdomain for account {account["id"]}: {type(error).__name__}')
                  continue
              if subdomain == "robloxproxy":
                  matches.append(account["id"])
          if len(matches) != 1:
              raise SystemExit(f'Expected one account for robloxproxy.workers.dev; found {len(matches)} among {len(accounts)} accessible accounts')
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f'CLOUDFLARE_ACCOUNT_ID={matches[0]}\n')
          print(f'Confirmed Cloudflare account {matches[0]} owns robloxproxy.workers.dev')
          PY
      - name: Inspect live chat implementation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import email
          import hashlib
          import os
          import re
          import urllib.request

          request = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{os.environ["CLOUDFLARE_ACCOUNT_ID"]}/workers/scripts/character-chat-worker',
              headers={"Authorization": f'Bearer {os.environ["CLOUDFLARE_API_TOKEN"]}'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = response.read()
              content_type = response.headers.get("Content-Type", "application/javascript")
          if content_type.startswith("multipart/"):
              message = email.message_from_bytes(
                  f'Content-Type: {content_type}\r\nMIME-Version: 1.0\r\n\r\n'.encode() + body
              )
              parts = [part.get_payload(decode=True) for part in message.walk() if not part.is_multipart()]
          else:
              parts = [body]
          source = '\n'.join(part.decode('utf-8', errors='replace') for part in parts)
          markers = list(re.finditer(r'^// src/([^\n]+)', source, re.MULTILINE))
          snippets = []
          names = []
          for index, marker in enumerate(markers):
              name = marker.group(1)
              if name.startswith(('services/chat/', 'providers/openrouter', 'lib/deadline', 'services/images/jobs')):
                  names.append(name)
                  end = markers[index + 1].start() if index + 1 < len(markers) else len(source)
                  snippets.append(source[marker.start():end])
          if not snippets:
              raise SystemExit('Could not locate chat code in the live Worker')
          output = os.path.join(os.environ['RUNNER_TEMP'], 'live-chat-sections.txt')
          with open(output, 'w') as result:
              result.write('\n'.join(snippets))
          print(f'Live Worker SHA256: {hashlib.sha256(source.encode()).hexdigest()}')
          print('Saved sections: ' + ', '.join(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-worker-chat-sections
          path: ${{ runner.temp }}/live-chat-sections.txt
          retention-days: 1
