name: Verify live Meek model fix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Worker content and deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request,os,json
          from email.parser import BytesParser
          from email.policy import default
          base='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          with urllib.request.urlopen(urllib.request.Request(base+'/content/v2',headers=headers),timeout=25) as r:
              body=r.read()
              ct=r.headers['Content-Type']
          parsed=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
          script='\n'.join(p.get_payload(decode=True).decode('utf-8') for p in parsed.iter_parts() if 'javascript' in p.get_content_type())
          assert 'var STANDARD_MODEL = "xiaomi/mimo-v2.6-pro";' in script
          assert 'var STANDARD_MODEL = "deepseek/deepseek-v4-flash-0731";' not in script
          print('VERIFIED: deployed Worker source STANDARD_MODEL uses MiMo V2.6 Pro, not DeepSeek Flash.')
          with urllib.request.urlopen(urllib.request.Request(base+'/deployments',headers=headers),timeout=20) as r: d=json.load(r)['result']['deployments'][0]
          print('Latest deployment:',d['created_on'],d['versions'])
          PY
