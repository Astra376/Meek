name: Inspect deployed Meek model references
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-live-model.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Search actual deployed Worker code for DeepSeek Flash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request, os, re, io, zipfile, json
          base='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          req=urllib.request.Request(base+'/content/v2',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as res:
              data=res.read()
              typ=res.headers.get('Content-Type','')
          print('Content type:',typ,'size:',len(data))
          s=data.decode('utf-8','replace')
          for pattern in ['deepseek-v4-flash','deepseek-v4.1-flash','deepseek/deepseek','OPENROUTER_MODEL','OPENROUTER_ULTRA_MODEL','OPENROUTER_FALLBACK_MODELS']:
              print('Occurrences',pattern, s.lower().count(pattern.lower()))
              for m in list(re.finditer(re.escape(pattern),s,re.I))[:3]:
                  print('  Context:', re.sub(r'\s+',' ',s[max(0,m.start()-100):min(len(s),m.end()+100)])[:260])
          PY
      - name: Inspect deployed Worker for Flash routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=25) as res:
              content=res.read().decode('utf-8','replace')
          patterns=['deepseek-v4-flash','deepseek-v4.1','deepseek/','OPENROUTER_MODEL','OPENROUTER_FALLBACK_MODELS','provider','models:']
          print('Script length:',len(content))
          for needle in patterns:
              print('MATCH',needle,'COUNT',len(list(re.finditer(re.escape(needle),content,re.I))))
          for needle in ('deepseek-v4-flash','deepseek-v4.1'):
              for m in list(re.finditer(re.escape(needle),content,re.I))[:8]:
                  print('FLASH_CONTEXT:',content[max(0,m.start()-160):m.end()+160].replace('\\n',' ')[:400])
          PY
