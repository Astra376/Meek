name: Diagnose live Meek model routing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-live-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed versions and model bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r: return json.load(r)
          dep=get(base+'/deployments')['result']['deployments'][0]
          print('Current deployment:',dep['created_on'])
          print('Deployed versions:',dep['versions'])
          for v in dep['versions']:
              vid=v.get('version_id') or v.get('id')
              if not vid: continue
              details=get(base+'/versions/'+vid)['result']
              binds=details.get('resources',{}).get('bindings',{})
              print('Version',vid,'bindings:')
              items=binds if isinstance(binds,list) else list(binds.values()) if isinstance(binds,dict) else []
              for b in items:
                  name=b.get('name','')
                  if name in ('OPENROUTER_MODEL','OPENROUTER_FALLBACK_MODELS'):
                      print(json.dumps({k:val for k,val in b.items() if k in ('name','type','text','value') and not (k in ('text','value') and name not in ('OPENROUTER_MODEL','OPENROUTER_FALLBACK_MODELS'))}))
                  elif 'OPENROUTER' in name: print(name,b.get('type'))
          PY
