name: Hotfix Meek MiMo provider routing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/emergency-model-diagnostics.yml']
permissions:
  contents: read
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch only MiMo provider routing in live Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re,json,secrets,urllib.request,urllib.error
          from email.parser import BytesParser
          from email.policy import default
          root='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          with urllib.request.urlopen(urllib.request.Request(root+'/content/v2',headers=headers),timeout=30) as response:
              original=response.read()
              typ=response.headers['Content-Type']
          parsed=BytesParser(policy=default).parsebytes(('Content-Type: '+typ+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+original)
          parts=[p for p in parsed.iter_parts() if 'javascript' in p.get_content_type()]
          assert len(parts)==1,'Unexpected live Worker bundle shape'
          module_name=parts[0].get_filename() or 'index.js'
          code=parts[0].get_payload(decode=True).decode('utf-8')
          assert 'var STANDARD_MODEL = "xiaomi/mimo-v2.6-pro";' in code,'Standard model is not MiMo'
          old='const only = (env.OPENROUTER_PROVIDERS ?? "").split(",").map((name) => name.trim()).filter(Boolean);'
          new='const only = (env.OPENROUTER_MODEL === "xiaomi/mimo-v2.6-pro" ? "" : (env.OPENROUTER_PROVIDERS ?? "")).split(",").map((name) => name.trim()).filter(Boolean);'
          assert code.count(old)==1,'Expected exact provider policy pattern once'
          patched=code.replace(old,new)
          assert 'ImageGenerationJob' in patched,'Missing required Durable Object'
          boundary='----meek-provider-fix-'+secrets.token_hex(12)
          def part(name,data,mime):
              return (('--'+boundary+'\r\nContent-Disposition: form-data; name="'+name+'"'+ ('; filename="'+name+'"' if name!='metadata' else '')+'\r\nContent-Type: '+mime+'\r\n\r\n').encode()+data+b'\r\n')
          body=part('metadata',json.dumps({'main_module':module_name}).encode(),'application/json')+part(module_name,patched.encode(),'application/javascript+module')+('--'+boundary+'--\r\n').encode()
          req=urllib.request.Request(root+'/content',data=body,method='PUT',headers={**headers,'Content-Type':'multipart/form-data; boundary='+boundary})
          try:
              with urllib.request.urlopen(req,timeout=45) as response: result=json.load(response)
          except urllib.error.HTTPError as e:
              raise RuntimeError('Cloudflare rejected hotfix: '+e.read(1800).decode('utf-8','replace')) from e
          assert result.get('success'),str(result.get('errors'))
          print('DEPLOYED: MiMo bypasses Venice provider filter; source and other bindings preserved.')
          with urllib.request.urlopen(urllib.request.Request(root+'/content/v2',headers=headers),timeout=30) as response:
              latest=response.read()
              typ=response.headers['Content-Type']
          p=BytesParser(policy=default).parsebytes(('Content-Type: '+typ+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+latest)
          saved='\n'.join(x.get_payload(decode=True).decode('utf-8') for x in p.iter_parts() if 'javascript' in x.get_content_type())
          assert new in saved,'Live code verification failed'
          assert 'var STANDARD_MODEL = "xiaomi/mimo-v2.6-pro";' in saved
          print('VERIFIED: live code has MiMo default and unrestricted model-compatible provider routing.')
          PY
