name: Fix MiMo provider routing in live Meek
on:
  push:
    branches: [main]
    paths: ['.github/workflows/emergency-model-diagnostics.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Clear Venice-only provider binding without changing Worker code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '6418d8b7a0996630c6eb574d93c85b54'
        run: |
          set -euo pipefail
          npx wrangler versions secret delete OPENROUTER_PROVIDERS --name character-chat-worker --yes 2>&1 | tee /tmp/provider-fix.log
          VERSION=$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/provider-fix.log | tail -n1)
          test -n "$VERSION"
          npx wrangler versions deploy "$VERSION@100%" --name character-chat-worker --yes
      - name: Verify deployed version has no restrictive provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=20) as r: return json.load(r)['result']
          versions=get('/deployments')['deployments'][0]['versions']
          assert len(versions)==1 and versions[0]['percentage']==100
          v=get('/versions/'+versions[0]['version_id'])
          binds=v.get('resources',{}).get('bindings',[])
          if isinstance(binds,dict): binds=list(binds.values())
          names={b['name']:b for b in binds}
          provider=names.get('OPENROUTER_PROVIDERS',{})
          assert not provider.get('text'), 'Provider restriction is still configured'
          assert names.get('OPENROUTER_API_KEY',{}).get('type')=='secret_text', 'OpenRouter key missing'
          assert names.get('OPENROUTER_MODEL',{}).get('type')=='secret_text', 'Main model binding missing'
          print('VERIFIED: 100% traffic on new version, provider restriction empty, OpenRouter bindings present')
          PY
