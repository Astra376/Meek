name: Inspect deployed Meek chat source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Identify live Worker authentication and chat execution paths
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,re,urllib.request
          from email.parser import BytesParser
          from email.policy import default
          root='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          req=urllib.request.Request(root+'/content/v2',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=25) as r:raw=r.read();ct=r.headers['Content-Type']
          parsed=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
          code='\n'.join(p.get_payload(decode=True).decode('utf8') for p in parsed.iter_parts() if 'javascript' in p.get_content_type())
          print('Live Worker JS length:',len(code))
          for label,pattern in [
            ('claim_run',r'(?:async )?function claimConversationRun\([^)]*\)\s*\{'),
            ('chat_send',r'async function sendMessageAndStream\([^)]*\)\s*\{'),
            ('session_refresh',r'async function refreshSession\([^)]*\)\s*\{'),
            ('stream_generation',r'async function\*? streamChatText\([^)]*\)\s*\{'),
            ('model_routing',r'function modelResolution\([^)]*\)\s*\{'),
            ('handler',r'async fetch\(request, env, executionContext\)\s*\{'),
          ]:
            m=re.search(pattern,code)
            print('===',label,'found?',bool(m))
            if m:
              snippet=code[m.start():m.start()+1800]
              snippet=re.sub(r'(Authorization:|api[_-]?key|token)\s*:\s*[^,}\n]+',r'\1: [redacted]',snippet,flags=re.I)
              print(snippet)
          PY
