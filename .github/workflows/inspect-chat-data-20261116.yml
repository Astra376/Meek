name: Diagnose Meek backend data status
on:
  push:
    paths:
      - .github/workflows/inspect-chat-data-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect D1 schema and aggregate chat run statuses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          root='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/d1/database/ad611737-fc84-4002-bcfe-0f0ce257f2ae/query'
          def query(sql):
            request=urllib.request.Request(root,method='POST',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'},data=json.dumps({'sql':sql}).encode())
            try:
              with urllib.request.urlopen(request,timeout=25) as response:
                payload=json.load(response)
              if not payload.get('success'):
                print('QUERY FAILURE:',payload.get('errors'));return []
              return payload['result'][0].get('results',[])
            except urllib.error.HTTPError as e:
              print('QUERY HTTP',e.code,e.read(300).decode('utf8','replace'));return []
          tables=query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")
          names=[x['name'] for x in tables]
          print('TABLES:',names)
          for n in names:
            if any(s in n for s in ('conversation','chat','message','run','model','auth','session')):
              print('SCHEMA',n,query("PRAGMA table_info('"+n+"')"))
          PY
