name: Diagnose Meek worker recent invocations
on:
  push:
    paths:
      - .github/workflows/inspect-chat-data-20261116.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query production Worker invocation outcomes without user request data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime,os,json,urllib.request,urllib.error,collections
          now=datetime.datetime.now(datetime.timezone.utc)
          gql='''query($accountTag: string, $datetimeStart: string, $datetimeEnd: string, $scriptName: string) {
            viewer { accounts(filter:{accountTag:$accountTag}) {
              workersInvocationsAdaptive(limit:5000,filter:{scriptName:$scriptName,datetime_geq:$datetimeStart,datetime_leq:$datetimeEnd}) {
                dimensions { datetime status scriptName }
                sum { requests errors subrequests }
              }
            } }
          }'''
          vals={'accountTag':'6418d8b7a0996630c6eb574d93c85b54',
            'datetimeStart':(now-datetime.timedelta(days=2)).isoformat().replace('+00:00','Z'),
            'datetimeEnd':now.isoformat().replace('+00:00','Z'),'scriptName':'character-chat-worker'}
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/graphql',method='POST',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'},data=json.dumps({'query':gql,'variables':vals}).encode())
          try:
            with urllib.request.urlopen(req,timeout=30) as resp: payload=json.load(resp)
            if payload.get('errors'):print('GRAPHQL ERRORS:',payload['errors'])
            entries=payload.get('data',{}).get('viewer',{}).get('accounts',[])
            if not entries:print('GRAPHQL DATA:',str(payload)[:1400])
            for a in entries:
              rows=a.get('workersInvocationsAdaptive',[])
              c=collections.Counter()
              for x in rows:
                d=x['dimensions'];s=x['sum']
                c[(d['datetime'][:13],d['status'])]+=s['requests']
              print('WORKER REQUESTS BY HOUR AND STATUS',sorted(c.items())[-70:])
              print('TOTAL ROWS',len(rows))
          except urllib.error.HTTPError as e: print('GRAPHQL HTTP',e.code,e.read(500).decode('utf8','replace'))
          PY
