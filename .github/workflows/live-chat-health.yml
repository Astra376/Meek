name: Diagnose Meek live chat November
on:
  push:
    paths:
      - .github/workflows/live-chat-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production routing and availability without changing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          from email.parser import BytesParser
          from email.policy import default
          root='https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          def get(url,auth=False):
              req=urllib.request.Request(url,headers=headers if auth else {'User-Agent':'okhttp/4.12.0'})
              with urllib.request.urlopen(req,timeout=25) as response: return response.read(),response.headers
          print('=== Production bindings (names/types only, no secrets) ===')
          body,_=get(root+'/settings',True)
          settings=json.loads(body)['result']
          for b in settings.get('bindings',[]):
              if b['name'].startswith('OPENROUTER_'):
                  print(b['name'],b['type'], 'value='+str(b.get('text','')) if b['name'] in ('OPENROUTER_PROVIDERS','OPENROUTER_FALLBACK_MODELS') else '')
          body,ct=get(root+'/content/v2',True)
          parsed=BytesParser(policy=default).parsebytes(('Content-Type: '+ct['Content-Type']+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
          parts=[p for p in parsed.iter_parts() if 'javascript' in p.get_content_type()]
          print('Worker JS module parts',len(parts),'ImageGenerationJob present?',any('ImageGenerationJob' in p.get_payload(decode=True).decode('utf-8') for p in parts))
          code='\n'.join(p.get_payload(decode=True).decode('utf-8') for p in parts)
          for label,pat in [
            ('standard model',r'var STANDARD_MODEL = [^;]+;'),
            ('ultra model',r'var ULTRA_MODEL = [^;]+;'),
            ('provider selection',r'function chatProviderSelection\(env\) \{.{0,750}'),
            ('chat stream first token timeout',r'var FIRST_TOKEN_MS = [^;]+;'),
            ('chat stream idle timeout',r'var STREAM_IDLE_MS = [^;]+;'),
            ('chat stream total timeout',r'var STREAM_TOTAL_MS = [^;]+;'),
          ]:
            m=re.search(pat,code,re.S)
            print(label+':',repr(m.group(0)[:750]) if m else 'NOT FOUND')
          print('=== Live unauthenticated protocol probes ===')
          base='https://character-chat-worker.robloxproxy.workers.dev'
          for method,path in [('OPTIONS','/v1/conversations/test/messages/stream'),('GET','/v1/home/feed')]:
            req=urllib.request.Request(base+path,method=method,headers={'User-Agent':'okhttp/4.12.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as response:
                print(method,path,response.status,response.read(250).decode('utf-8','replace'))
            except urllib.error.HTTPError as e:
              print(method,path,e.code,e.read(250).decode('utf-8','replace'))
            except Exception as e:
              print(method,path,type(e).__name__,str(e)[:120])
          body,_=get(root+'/deployments',True)
          deploy=json.loads(body)['result']['deployments'][0]
          print('Cloudflare active deployment:',deploy['created_on'],deploy['versions'])
          PY
