name: Meek 1.1.75
on:
  push:
    branches: [release/meek-1.1.73]
    paths: ['android-app/**', '.github/workflows/meek-1.1.73.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false
      - name: Build phone update
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --tests com.example.aichat.feature.chat.CharacterMemoryRepositoryTest :app:assembleRelease -PAI_CHAT_VERSION_CODE=1075 -PAI_CHAT_VERSION_NAME=1.1.75 -PAI_CHAT_BUILD_SHA=${GITHUB_SHA::7}
      - name: Verify Android package and signing certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download transcript-fix-2026-09-27 --repo "$GITHUB_REPOSITORY" --pattern Meek-1.1.72.apk --dir "$RUNNER_TEMP"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          digest() { "$signer" verify --print-certs "$1" | awk '/Signer #1 certificate SHA-256 digest/ {print $NF}'; }
          previous=$(digest "$RUNNER_TEMP/Meek-1.1.72.apk")
          test -n "$previous" && test "$previous" = "$(digest "$apk")"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "^package:" > "$RUNNER_TEMP/package-info"
          grep "name='com.example.aichat' versionCode='1075' versionName='1.1.75'" "$RUNNER_TEMP/package-info"
      - uses: actions/upload-artifact@v4
        with:
          name: meek-1.1.75
          path: android-app/app/build/outputs/apk/release/app-release.apk
