name: Meek 1.1.73
on:
  push:
    branches: [release/meek-1.1.73]
    paths: ['android-app/**', '.github/workflows/meek-1.1.73.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false
      - name: Build phone update
        run: gradle --no-daemon --max-workers=2 :app:assembleRelease -PAI_CHAT_VERSION_CODE=1073 -PAI_CHAT_VERSION_NAME=1.1.73 -PAI_CHAT_BUILD_SHA=${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v4
        with:
          name: meek-1.1.73
          path: android-app/app/build/outputs/apk/release/app-release.apk

  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meek-1.1.73
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk Meek-1.1.73.apk
          gh release create meek-1.1.73 Meek-1.1.73.apk --target "$GITHUB_SHA" --title 'Meek 1.1.73' --notes 'Disables automatic chat background generation.'
