name: Deploy Meek memory and character update
on:
  push:
    branches: [release/meek-1.1.73]
    paths: ['.github/workflows/memory-tiers.yml', 'backend/scripts/apply_memory_tiers.py', 'backend/scripts/check_memory_tiers.mjs']
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx esbuild src/services/chat/durableMemorySource.ts --format=esm --outfile=/tmp/durable-source.mjs
      - name: Exercise memory persistence and update active Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/apply_memory_tiers.py
