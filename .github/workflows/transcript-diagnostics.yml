name: Inspect live transcript handlers

on:
  push:
    branches: [fix/transcript-persistence]
    paths:
      - .github/workflows/transcript-diagnostics.yml
      - backend/scripts/inspect_live_transcript.py
      - backend/scripts/check_transcript_runtime.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Test deployed handlers against isolated synthetic conversations
        env:
          CLOUDFLARE_ACCOUNT_ID: 6418d8b7a0996630c6eb574d93c85b54
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 backend/scripts/inspect_live_transcript.py
