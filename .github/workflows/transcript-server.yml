name: Deploy transcript server fix

on:
  push:
    branches: [fix/transcript-persistence-release]
    paths: ['backend/scripts/**', '.github/workflows/transcript-server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run src/db/queries/transcriptMutations.test.ts src/services/chat/streamLifecycle.test.ts
      - run: npx tsc --noEmit
      - name: Build reviewed transcript replacement
        run: npx esbuild src/index.ts --bundle --format=esm --platform=browser --external:cloudflare:workers --outfile="$RUNNER_TEMP/transcript-worker.mjs"
      - name: Verify isolated before/after behavior and apply guarded content patch
        env:
          CLOUDFLARE_ACCOUNT_ID: 6418d8b7a0996630c6eb574d93c85b54
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/hotfix_live_transcript.py --bundle "$RUNNER_TEMP/transcript-worker.mjs" --deploy
