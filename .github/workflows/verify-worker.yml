name: Verify Meek Worker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-worker.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production Worker HTTP responses
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'https://character-chat-worker.robloxproxy.workers.dev'
          passed = False
          for label, agent in [
              ('Android', 'okhttp/4.12.0'),
              ('curl', 'curl/8.5.0'),
              ('desktop', 'Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/125.0 Mobile Safari/537.36'),
          ]:
              preflight = urllib.request.Request(
                  base + '/v1/conversations/test/messages/stream',
                  method='OPTIONS',
                  headers={'User-Agent': agent},
              )
              try:
                  with urllib.request.urlopen(preflight, timeout=15) as response:
                      print(label, 'preflight status:', response.status)
                      passed = response.status == 204
                      if passed:
                          break
              except urllib.error.HTTPError as error:
                  print(label, 'preflight status:', error.code, 'body:', error.read(120).decode('utf-8', errors='replace'))
          assert passed, 'Cloudflare blocked all HTTP user agents before the Worker'
          try:
              protected = urllib.request.Request(base + '/v1/home/feed', headers={'User-Agent': 'okhttp/4.12.0'})
              urllib.request.urlopen(protected, timeout=15)
          except urllib.error.HTTPError as error:
              body = json.load(error)
              assert error.code == 401 and body.get('code') == 'AUTH_REQUIRED', (
                  error.code, body,
              )
          else:
              raise AssertionError('Protected route did not require authentication')
          print('Production Worker responds to CORS preflight and rejects unauthenticated requests correctly')
          PY
      - name: Check active Cloudflare deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = 'https://api.cloudflare.com/client/v4/accounts/6418d8b7a0996630c6eb574d93c85b54/workers/scripts/character-chat-worker/deployments'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=15) as response:
              deployment = json.load(response)['result']['deployments'][0]
          print('Active deployment:', deployment['created_on'], deployment['versions'])
          assert deployment['created_on'] >= '2026-09-24T05:33:00', 'Chat patch is not active'
          PY
